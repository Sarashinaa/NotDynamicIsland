[package]
name = "not_dynamic_island"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.5"
mimalloc = "0.1.52"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Media_Control", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "implement", "Win32_System_LibraryLoader", "Foundation_Collections", "Win32_System_SystemInformation", "Win32_Security", "Win32_Networking_WinHttp", "Win32_UI_HiDpi", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_Graphics_Imaging", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
windows-core = "0.58"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

